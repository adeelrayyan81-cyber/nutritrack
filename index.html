<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NutriTrack</title>
  <meta name="description" content="NutriTrack — your nutrition companion. Track meals with USDA data, scan foods, earn nutrition points and compete with friends.">
  <meta name="theme-color" content="#2f9e62">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NutriTrack">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="logo-slot" data-logo></div>
        <div><div class="brand-name">NutriTrack</div><div class="brand-sub">Your nutrition companion</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn sm" id="installBtn" hidden></button>
        <a class="insta" data-insta target="_blank" rel="noopener"></a>
      </div>
    </aside>

    <header class="topbar">
      <div class="row">
        <div class="logo-slot" data-logo></div>
        <div class="brand-name">NutriTrack</div>
      </div>
      <div class="row">
        <span class="pill green" id="topPts"></span>
        <a class="icon-btn" data-insta target="_blank" rel="noopener" aria-label="NutriTrack on Instagram"></a>
      </div>
    </header>

    <main class="main" id="main" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Quick navigation"></nav>
    <div class="sheet" id="sheet" role="dialog" aria-label="More pages">
      <div class="sheet-in"><div class="grab"></div><nav id="sheetNav"></nav></div>
    </div>
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="data/foods.js"></script>
  <script src="data/recipes.js"></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
